name: Windows launcher bundle check
on:
  pull_request:
    paths:
      - 'src/client/**'
      - 'assets/skills/project-handover-*/**'
      - 'assets/skills/_shared/project-handover/**'
      - 'lib/client.js'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/launcher-bundle.yml'
  push:
    branches:
      - feat/launcher-action-groups
      - refactor/remove-s0-s9-workflow-20261029
      - master

permissions:
  contents: write

jobs:
  bundle:
    if: "github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(bundle):')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript compiler
        shell: pwsh
        run: npm install --prefix .build-tools --no-save --no-package-lock typescript@5.9.3
      - name: Rebuild shipped bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --experimental-transform-types scripts/rebuild-launcher-bundle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-transform-types scripts/build-action-bundle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify browser and host bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check lib/client.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check lib/index.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-client-bundle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-launcher-render.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-transform-types --test tests/launcher-layout.node.test.mjs tests/setup-readiness.node.test.mjs tests/pocket-document-authority.node.test.mjs tests/project-handover.node.test.mjs tests/diagnostic-shortcuts.node.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s assets/skills/_shared/project-handover/scripts -p test_handover_write_guard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit generated runtime files
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -f lib/client.js lib/index.js lib/types/client/index.d.ts lib/types/client/setup-readiness.js lib/types/client/setup-readiness.d.ts lib/types/client/setup-readiness.js.map lib/types/client/setup-readiness.d.ts.map
          $changed = @(git diff --cached --name-only)
          Write-Host "Staged generated files: $($changed -join ", ")"
          if ($changed.Count -gt 0) {
            git commit -m "chore(bundle): synchronize launcher runtime"
            git push origin HEAD:${{ github.ref_name }}
          }
